    <!-- ============================================================
         MOBILE-FIRST GLOBAL BASE + ANIMATION SYSTEM
         (React/Tailwind ko touch nahi karta, sirf support deta hai)
    ============================================================ -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        scroll-behavior: smooth;
        overflow-x: hidden;          /* horizontal scroll band */
      }

      body {
        margin: 0;
        min-height: 100dvh;
        overflow-x: hidden;          /* phone pe layout break na ho */
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
        text-rendering: optimizeLegibility;
      }

      #root { min-height: 100dvh; isolation: isolate; }

      /* canvas / images kabhi viewport se bahar na jayein */
      img, svg, video, canvas, iframe { max-width: 100%; }
      canvas { display: block; touch-action: none; }

      /* 300ms tap delay hatao */
      a, button, [role="button"] { touch-action: manipulation; }

      /* ---- Scrollbar (desktop only) ---- */
      @media (min-width: 1024px) {
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #0c0e13; }
        ::-webkit-scrollbar-thumb {
          background: #2a2e3a;
          border-radius: 999px;
          border: 2px solid #0c0e13;
        }
        ::-webkit-scrollbar-thumb:hover { background: #00f5a0; }
      }

      /* ============================================================
         ANIMATIONS
      ============================================================ */
      @keyframes tx-fade-up {
        from { opacity: 0; transform: translate3d(0, 26px, 0); }
        to   { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      @keyframes tx-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes tx-float {
        0%, 100% { transform: translate3d(0, 0, 0); }
        50%      { transform: translate3d(0, -14px, 0); }
      }
      @keyframes tx-orb-drift {
        0%   { transform: translate3d(0, 0, 0) scale(1); }
        50%  { transform: translate3d(24px, -30px, 0) scale(1.12); }
        100% { transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes tx-glow-pulse {
        0%, 100% { opacity: .35; }
        50%      { opacity: .75; }
      }
      @keyframes tx-gradient-pan {
        0%   { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      @keyframes tx-sheen {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(220%); }
      }

      /* Scroll reveal (data-reveal + .tx-fade-up) */
      .tx-fade-up {
        opacity: 0;
        transform: translate3d(0, 26px, 0);
        transition:
          opacity .7s cubic-bezier(.22, .8, .24, 1),
          transform .7s cubic-bezier(.22, .8, .24, 1);
        will-change: opacity, transform;
      }
      .tx-fade-up.is-visible {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      .tx-fade-in { animation: tx-fade-in .8s ease-out both; }
      .tx-float   { animation: tx-float 6s ease-in-out infinite; }

      /* Decorative glow orbs (footer / hero) */
      .tx-orb {
        position: absolute;
        border-radius: 9999px;
        filter: blur(60px);
        animation: tx-orb-drift 14s ease-in-out infinite, tx-glow-pulse 8s ease-in-out infinite;
        pointer-events: none;
      }
      .tx-orb--a {
        width: 260px; height: 260px;
        top: -80px; left: -70px;
        background: radial-gradient(circle at 30% 30%, #00f5a0, transparent 70%);
        opacity: .35;
      }
      .tx-orb--b {
        width: 300px; height: 300px;
        bottom: -120px; right: -90px;
        background: radial-gradient(circle at 60% 40%, #6d5efc, transparent 70%);
        opacity: .35;
        animation-delay: -6s, -3s;
      }

      /* Social pill hover sheen */
      .tx-social {
        position: relative;
        overflow: hidden;
        transition: transform .28s cubic-bezier(.22,.8,.24,1),
                    border-color .28s ease,
                    background-color .28s ease,
                    box-shadow .28s ease;
      }
      .tx-social:hover,
      .tx-social:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(0, 245, 160, .5);
        background-color: rgba(0, 245, 160, .08);
        box-shadow: 0 8px 28px -12px rgba(0, 245, 160, .55);
      }
      .tx-social::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.16) 50%, transparent 80%);
        transform: translateX(-120%);
        pointer-events: none;
      }
      .tx-social:hover::after,
      .tx-social:focus-visible::after {
        animation: tx-sheen .8s ease-out;
      }
      .tx-social:active { transform: translateY(0) scale(.985); }

      /* Gradient text */
      .tx-gradient-text {
        background-image: linear-gradient(90deg, #00f5a0, #4fd1ff, #6d5efc, #00f5a0);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: tx-gradient-pan 8s linear infinite;
      }

      /* ============================================================
         MOBILE RESPONSIVE GUARDS
      ============================================================ */
      @media (max-width: 640px) {
        /* Tap target minimum 44px */
        a, button, [role="button"] { min-height: 44px; }

        /* Heading overflow clamp */
        h1, h2, h3 { overflow-wrap: anywhere; word-break: break-word; }

        /* Long URLs / code blocks */
        pre, code { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        /* Footer bottom safe-area (iPhone notch) */
        .tx-safe-bottom {
          padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
        }
      }

      /* Reduced motion – accessibility */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after {
          animation-duration: .001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .001ms !important;
        }
        .tx-fade-up { opacity: 1 !important; transform: none !important; }
      }
    </style>
  </head>

  <body class="bg-[#111319] text-[#e1e2ea] antialiased selection:bg-[#00f5a0] selection:text-[#006b43] min-h-screen">
    <div id="root"></div>

    <!-- Scroll-reveal observer (React ke content pe bhi kaam karta hai) -->
    <script>
      (function () {
        if (!("IntersectionObserver" in window)) {
          document.querySelectorAll("[data-reveal]").forEach(function (el) {
            el.classList.add("is-visible");
          });
          return;
        }

        var io = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                io.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.12, rootMargin: "0px 0px -40px 0px" }
        );

        var scheduled = false;
        function scan() {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(function () {
            scheduled = false;
            document
              .querySelectorAll("[data-reveal]:not(.is-visible)")
              .forEach(function (el) { io.observe(el); });
          });
        }

        document.addEventListener("DOMContentLoaded", scan);
        window.addEventListener("load", scan);

        // React render hone ke baad naye elements auto-observe ho jayein
        if (window.MutationObserver && document.body) {
          new MutationObserver(scan).observe(document.body, {
            childList: true,
            subtree: true,
          });
        }
      })();
    </script>
